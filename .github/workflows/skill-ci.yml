name: Skill CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  skill-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Distribution smoke test (Core-Test-9)
        run: bash scripts/test-skill-smoke.sh

      - name: SKILL.md drift check (Docs-Doc-10)
        run: bash scripts/check-skill-md-drift.sh
