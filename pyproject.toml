[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cheap-second-opinion"
version = "0.1.0"
description = "OpenRouter-backed read-only second-opinion CLI and Codex skill"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cheap-opinion = "cheap_opinion.cli:main"

[tool.setuptools.packages.find]
# intent: DEC-001 (Core/cli-unification) — skill dir 側を single source-of-truth に。
# src/ 削除後は skills/cheap-second-opinion/scripts/ 配下の cheap_opinion package が唯一の実体。
where = ["skills/cheap-second-opinion/scripts"]

[tool.setuptools.package-data]
cheap_opinion = ["models.toml"]
